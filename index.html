<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iris Species Predictor</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f3f6fb; display:flex; justify-content:center; padding:40px; }
    .card { background:#fff; padding:30px 36px; border-radius:12px; box-shadow:0 4px 16px rgba(0,0,0,.1); width:360px; }
    h1 { font-size:22px; margin-top:0; color:#1f3a5f; }
    label { display:block; margin:12px 0 4px; font-size:14px; }
    input { width:100%; padding:8px; box-sizing:border-box; border:1px solid #bbb; border-radius:6px; }
    button { margin-top:18px; width:100%; padding:10px; background:#1f6feb; color:#fff; border:0; border-radius:6px; font-size:16px; cursor:pointer; }
    .result { margin-top:18px; padding:12px; background:#e6f6ea; border-radius:6px; color:#1a7f37; font-weight:bold; }
    .error { margin-top:18px; padding:12px; background:#fdecea; border-radius:6px; color:#b42318; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Iris Species Predictor</h1>
    <form method="POST" action="/predict">
      <label>Sepal length (cm)</label>
      <input name="sepal_length" value="{{ form.get('sepal_length', '') }}" required>
      <label>Sepal width (cm)</label>
      <input name="sepal_width" value="{{ form.get('sepal_width', '') }}" required>
      <label>Petal length (cm)</label>
      <input name="petal_length" value="{{ form.get('petal_length', '') }}" required>
      <label>Petal width (cm)</label>
      <input name="petal_width" value="{{ form.get('petal_width', '') }}" required>
      <button type="submit">Predict</button>
    </form>
    {% if result %}<div class="result">Predicted species: {{ result }}</div>{% endif %}
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </div>
</body>
</html>
